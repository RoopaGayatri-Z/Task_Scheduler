worker_processes auto;
events { worker_connections 1024; }

http {
    # Log which backend container served each request.
    log_format lb '$remote_addr "$request" status=$status '
                  'upstream=$upstream_addr instance=$upstream_http_x_instance '
                  'rt=$request_time';
    access_log /dev/stdout lb;

    upstream task_backend {
        server backend1:8000 max_fails=1 fail_timeout=10s;
        server backend2:8000 max_fails=1 fail_timeout=10s;
        server backend3:8000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://task_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
